name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run backend test suite (Jest + Supertest)
        run: npm test
        env:
          # A placeholder key is enough: the Anthropic SDK is mocked in
          # tests (see __mocks__/@anthropic-ai/sdk.js), so no real API
          # call or real credential is ever needed here.
          ANTHROPIC_API_KEY: test-key-not-real

  # E2E (Playwright) tests are not run in CI yet — they need a real
  # browser binary installed (npx playwright install), which is a
  # separate, heavier CI job. Left as a manual/local step for now;
  # see e2e/chat-widget.spec.js for how to run them locally.
